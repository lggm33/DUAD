<div class="history-container">
  <div class="history-header">
    <div class="history-header-left">
      <a id="back-to-game" href="#" data-link class="back-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5"></path>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back to Game</span>
      </a>
      <div class="history-title-section">
        <h1 id="history-game-name" class="history-title">Adventure Log History</h1>
        <p class="history-subtitle">Complete chronological record of the adventure</p>
      </div>
    </div>
    <div class="history-header-right">
      <button id="print-history-btn" class="btn btn-ghost">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
        <span>Print / Save as PDF</span>
      </button>
    </div>
  </div>

  <div class="history-content">
    <div id="history-loading" class="history-loading">
      <span class="loader loader-lg"></span>
      <p>Loading history...</p>
    </div>

    <div id="history-error" class="history-error" hidden>
      <p id="history-error-message">Failed to load history.</p>
    </div>

    <div id="history-log" class="history-log" hidden>
      <!-- History entries will be rendered here -->
    </div>

    <div id="history-empty" class="history-empty" hidden>
      <p>The adventure has just begun. There are no entries yet.</p>
    </div>
  </div>
</div>
