<div class="inventory-container">
  <div class="inventory-header">
    <div class="inventory-header-left">
      <button id="back-to-game-btn" class="back-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5"></path>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back to Game</span>
      </button>
      <div class="inventory-title-section">
        <h1 class="inventory-title">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 7h-9a2 2 0 0 1-2-2V2"></path>
            <path d="M9 2v3a2 2 0 0 0 2 2h9"></path>
            <path d="M3 7v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7"></path>
            <line x1="8" y1="12" x2="16" y2="12"></line>
            <line x1="8" y1="16" x2="16" y2="16"></line>
          </svg>
          <span id="character-name">Character</span>'s Inventory
        </h1>
      </div>
    </div>
    <div class="inventory-header-right">
      <button id="add-item-btn" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Add Item</span>
      </button>
    </div>
  </div>

  <!-- Loading State -->
  <div id="inventory-loading" class="inventory-loading">
    <span class="loader loader-lg"></span>
    <p>Loading inventory...</p>
  </div>

  <!-- Error State -->
  <div id="inventory-error" class="inventory-error" hidden>
    <div class="error-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>
    <h2>Unable to load inventory</h2>
    <p id="inventory-error-message">Something went wrong</p>
    <button id="retry-load-btn" class="btn btn-primary">Retry</button>
  </div>

  <!-- Message -->
  <div id="inventory-message" class="inventory-message" hidden></div>

  <!-- Inventory Content -->
  <div id="inventory-content" class="inventory-content" hidden>
    <!-- Empty State -->
    <div id="inventory-empty" class="inventory-empty" hidden>
      <div class="empty-icon">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M20 7h-9a2 2 0 0 1-2-2V2"></path>
          <path d="M9 2v3a2 2 0 0 0 2 2h9"></path>
          <path d="M3 7v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7"></path>
        </svg>
      </div>
      <h3>Empty Inventory</h3>
      <p>No items yet. Add your first item to get started!</p>
    </div>

    <!-- Inventory Table -->
    <div id="inventory-table-container" class="inventory-table-container" hidden>
      <table class="inventory-table">
        <thead>
          <tr>
            <th>Item Name</th>
            <th>Description</th>
            <th class="quantity-column">Quantity</th>
            <th class="actions-column">Actions</th>
          </tr>
        </thead>
        <tbody id="inventory-items">
          <!-- Items will be rendered here -->
        </tbody>
      </table>
    </div>
  </div>

  <div class="inventory-decoration">
    <div class="decoration-orb decoration-orb-1"></div>
    <div class="decoration-orb decoration-orb-2"></div>
  </div>
</div>

<!-- Item Modal -->
<div id="item-modal" class="modal" hidden>
  <div class="modal-backdrop">
    <div class="decoration-orb decoration-orb-1"></div>
    <div class="decoration-orb decoration-orb-2"></div>
    <div class="decoration-orb decoration-orb-3"></div>
  </div>
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modal-title">Add Item</h2>
      <button id="close-modal-btn" class="modal-close-btn" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <form id="item-form" class="modal-body">
      <div class="form-group">
        <label for="item-name" class="form-label">Item Name <span class="required">*</span></label>
        <input 
          type="text" 
          id="item-name" 
          class="form-input" 
          required
          maxlength="100"
          placeholder="e.g., Long Sword"
        />
      </div>
      
      <div class="form-group">
        <label for="item-description" class="form-label">Description</label>
        <textarea 
          id="item-description" 
          class="form-textarea" 
          rows="3"
          maxlength="500"
          placeholder="Describe the item..."
        ></textarea>
      </div>
      
      <div class="form-group">
        <label for="item-quantity" class="form-label">Quantity <span class="required">*</span></label>
        <input 
          type="number" 
          id="item-quantity" 
          class="form-input" 
          required
          min="1"
          max="999"
          value="1"
        />
      </div>

      <div class="modal-footer">
        <button type="button" id="cancel-modal-btn" class="btn btn-ghost">Cancel</button>
        <button type="submit" id="save-item-btn" class="btn btn-primary">
          <span id="save-btn-text">Add Item</span>
          <span id="save-btn-loader" class="loader loader-sm" hidden></span>
        </button>
      </div>
    </form>
  </div>
</div>
