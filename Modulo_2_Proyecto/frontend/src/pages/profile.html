<div class="profile-container">
  <div class="profile-header">
    <div class="profile-logo-section">
      <a href="/dashboard" data-link class="profile-logo-link">
        <img src="/logo.png" alt="Lyfter DnD" class="profile-logo" />
      </a>
      <div class="profile-title-group">
        <h1 class="profile-title">User Profile</h1>
        <p class="profile-subtitle">Manage your personal information</p>
      </div>
    </div>
    <a href="/dashboard" data-link class="btn btn-ghost">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span>Back to Dashboard</span>
    </a>
  </div>

  <div class="profile-content">
    <div class="profile-card">
      <div class="profile-card-header">
        <h2 class="profile-card-title">Personal Information</h2>
        <p class="profile-card-subtitle">Update your name, username, and email address</p>
      </div>

      <form id="profile-form" class="profile-form">
        <div class="form-group">
          <label for="name" class="form-label">Full Name</label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            class="form-input" 
            placeholder="Gandalf the Grey"
            required 
            autocomplete="name"
          />
        </div>

        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="form-input" 
            placeholder="gandalf123"
            autocomplete="username"
          />
          <span class="form-hint">This is your unique identifier in the realm</span>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-input" 
            placeholder="hero@lyfter.com"
            required 
            autocomplete="email"
          />
        </div>

        <div id="profile-message" class="profile-message" hidden></div>

        <div class="profile-form-actions">
          <button type="submit" class="btn btn-primary">
            <span class="btn-text">Save Changes</span>
            <span class="btn-loader" hidden>
              <span class="loader"></span>
            </span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="profile-decoration">
    <div class="decoration-orb decoration-orb-1"></div>
    <div class="decoration-orb decoration-orb-2"></div>
  </div>
</div>
