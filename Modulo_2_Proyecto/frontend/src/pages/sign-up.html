<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <a href="/" data-link class="auth-logo-link">
        <img src="/logo.png" alt="Lyfter DnD" class="auth-logo" />
      </a>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Begin your legendary journey</p>
    </div>

    <form id="sign-up-form" class="auth-form">
      
      <div class="form-group">
        <label for="name" class="form-label">Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          class="form-input" 
          placeholder="Gandalf"
          required 
          autocomplete="name"
        />
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-input" 
          placeholder="hero@lyfter.com"
          required 
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-input" 
          placeholder="••••••••"
          required 
          autocomplete="new-password"
          minlength="8"
        />
        <span class="form-hint">At least 8 characters</span>
      </div>

      <div class="form-group">
        <label for="confirm-password" class="form-label">Confirm Password</label>
        <input 
          type="password" 
          id="confirm-password" 
          name="confirm_password" 
          class="form-input" 
          placeholder="••••••••"
          required 
          autocomplete="new-password"
        />
      </div>

      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" name="terms" class="checkbox-input" required />
          <span>I agree to the <a href="/terms" class="link-primary">Terms of Service</a></span>
        </label>
      </div>

      <div id="form-error" class="form-error" hidden></div>

      <button type="submit" class="btn btn-primary btn-full">
        <span class="btn-text">Create Account</span>
        <span class="btn-loader" hidden>
          <span class="loader"></span>
        </span>
      </button>
    </form>

    <div class="auth-divider">
      <span>or</span>
    </div>

    <div class="auth-footer">
      <p>Already have an account? <a href="/sign-in" data-link class="link-primary">Sign in</a></p>
    </div>
  </div>

  <div class="auth-decoration">
    <div class="decoration-orb decoration-orb-1"></div>
    <div class="decoration-orb decoration-orb-2"></div>
    <div class="decoration-orb decoration-orb-3"></div>
  </div>
</div>
