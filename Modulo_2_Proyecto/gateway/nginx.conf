worker_processes  1;

# Keep runtime artifacts inside the gateway folder when using `-p gateway/`
pid       logs/nginx.pid;
error_log logs/error.log warn;

events {
  worker_connections  1024;
}

http {
  # Log + runtime files are kept inside the gateway folder when running with:
  # nginx -p "<repo>/gateway" -c "<repo>/gateway/nginx.conf"
  access_log logs/access.log;

  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  # Temp paths (relative to `-p` prefix)
  client_body_temp_path temp/client_body;
  proxy_temp_path       temp/proxy;

  # Useful defaults for reverse proxy
  proxy_buffering off;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  # Local upstreams (Vite dev + Flask backend)
  upstream frontend_dev {
    # Some setups bind Vite only to IPv6 loopback (::1) admits `localhost`
    # but not IPv4 (127.0.0.1). Keep both for resilience.
    server 127.0.0.1:5173 max_fails=1 fail_timeout=1s;
    server [::1]:5173 max_fails=1 fail_timeout=1s;
  }

  upstream backend_api {
    server 127.0.0.1:8000;
  }

  include default.conf;
}

